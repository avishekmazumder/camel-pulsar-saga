spring:
  pulsar:
    client:
      service-url: pulsar://localhost:6650
    consumer:
      subscription:
        name: orchestrator
    defaults:
      type-mappings:
        - messageType: com.example.model.OrchestrationResponse
          schema-info:
            schema-type: JSON
        - messageType: com.example.model.CommandMessage
          schema-info:
            schema-type: JSON
        - messageType: com.example.model.ReplyMessage
          schema-info:
            schema-type: JSON

app:
  pulsar:
    admin-url: "http://localhost:8085"
    service-a:
      command-topic: "persistent://public/default/service-a.commands"
      response-topic: "persistent://public/default/service-a.responses"
      compensate-topic: "persistent://public/default/service-a.compensate"
      reply-subscription: "orchestrator-a-replies"
    service-b:
      command-topic: "persistent://public/default/service-b.commands"
      response-topic: "persistent://public/default/service-b.responses"
      compensate-topic: "persistent://public/default/service-b.compensate"
      reply-subscription: "orchestrator-b-replies"
