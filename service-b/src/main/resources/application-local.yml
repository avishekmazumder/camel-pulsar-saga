spring:
  pulsar:
    client:
      service-url: pulsar://localhost:6650
    consumer:
      subscription:
        name: serviceB
    defaults:
      type-mappings:
        - messageType: com.example.model.CommandMessage
          schema-info:
            schema-type: JSON
        - messageType: com.example.model.ReplyMessage
          schema-info:
            schema-type: JSON

app:
  pulsar:
    command-topic: "persistent://public/default/service-b.commands"
    response-topic: "persistent://public/default/service-b.responses"
    compensate-topic: "persistent://public/default/service-b.compensate"
